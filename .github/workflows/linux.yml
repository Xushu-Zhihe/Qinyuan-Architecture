name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Run backend tests and static compilation
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q experiments orchestrator worker web tools main.py web_main.py
          python main.py --help
          python tools/build_release.py --check-only

      - name: Verify Docker daemon
        run: docker info

      - name: Run real Docker boundary tests with fake provider
        env:
          PYTHONIOENCODING: utf-8
          QINYUAN_RUN_DOCKER_TESTS: "1"
          QINYUAN_TEST_CONTAINER_IMAGE: python:3.12-alpine
        run: python -m unittest tests.test_container_integration -v

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Align npm with the pinned toolchain
        run: |
          if [ "$(npm --version)" != "11.16.0" ]; then
            npm install --global npm@11.16.0
          fi
          test "$(npm --version)" = "11.16.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend tests and production build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run fake-provider E2E
        working-directory: frontend
        env:
          BLACKBOARD_E2E_API_PORT: "8012"
          BLACKBOARD_E2E_WEB_PORT: "5182"
        run: npm run test:e2e

      - name: Build verified source release
        run: python tools/build_release.py

      - name: Upload source release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qinyuan-linux-source-release
          path: dist/qinyuan-blackboard-*.zip
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qinyuan-linux-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
