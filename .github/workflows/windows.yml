name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Run backend tests and static compilation
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:TEMP = "$env:USERPROFILE\AppData\Local\Temp"
          $env:TMP = $env:TEMP
          python -m unittest discover -s tests -v
          python -m compileall -q autopilot experiments orchestrator worker web tools main.py web_main.py
          python main.py --help
          python tools/build_release.py --check-only

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Align npm with the pinned toolchain
        shell: pwsh
        run: |
          if ((npm --version).Trim() -ne "11.16.0") {
            npm install --global npm@11.16.0
          }
          if ((npm --version).Trim() -ne "11.16.0") {
            throw "npm 11.16.0 is required"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend tests and production build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run fake-provider E2E
        working-directory: frontend
        env:
          BLACKBOARD_E2E_API_PORT: "8011"
          BLACKBOARD_E2E_WEB_PORT: "5181"
        run: npm run test:e2e

      - name: Build environment checker from source
        shell: pwsh
        run: |
          ./tools/build_environment_checker.ps1 -Output ./dist/QinyuanEnvironmentChecker.exe
          $process = Start-Process -FilePath ./dist/QinyuanEnvironmentChecker.exe -ArgumentList @("--report", "./dist/environment-report.json") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1)) {
            throw "environment checker crashed with exit code $($process.ExitCode)"
          }
          $report = Get-Content ./dist/environment-report.json | ConvertFrom-Json
          $required = @("Python", "Node.js", "npm", "Git")
          foreach ($name in $required) {
            $check = $report.checks | Where-Object { $_.name -eq $name }
            if (-not $check -or -not $check.passed) {
              throw "required environment check failed: $name"
            }
          }
          Get-Content ./dist/environment-report.json

      - name: Build verified source release
        run: python tools/build_release.py

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qinyuan-windows-artifacts
          path: |
            dist/qinyuan-blackboard-*.zip
            dist/QinyuanEnvironmentChecker.exe
            dist/environment-report.json
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qinyuan-windows-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
